version: 2
updates:
  # keeps the SHA-pinned actions in .github/workflows current;
  # Dependabot updates both the pin and its version comment
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Gradle plugins and their transitive dependencies execute during every CI build, so they
  # need security advisories rather than only the `versions` plugin's newer-release notices.
  # Covers gradle/libs.versions.toml as well as the build scripts.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
